[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-git-janitor"
version = "1.0.0rc1"
description = "A safe, local-first AI software engineering agent for Git repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Edin Bula" }
]
dependencies = [
  "gitpython>=3.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2,<2",
]
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
git-janitor = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
