name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate tagged distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip "build>=1.2,<2"
          python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/janitor-release-test
          /tmp/janitor-release-test/bin/python -m pip install dist/*.whl
          /tmp/janitor-release-test/bin/git-janitor version

      - name: Upload tagged distributions
        uses: actions/upload-artifact@v6
        with:
          name: agentic-git-janitor-${{ github.ref_name }}
          path: dist/*
