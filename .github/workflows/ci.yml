name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy app

      - name: pytest
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Bandit security scan
        run: python -m bandit -q -r app

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade pip "build>=1.2,<2"

      - name: Build distributions
        run: python -m build

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/janitor-wheel-test
          /tmp/janitor-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/janitor-wheel-test/bin/git-janitor version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: agentic-git-janitor-distributions
          path: dist/*
